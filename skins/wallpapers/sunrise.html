<!-- HTML wallpaper: markup goes in #wp_custom; <style> blocks (or a sibling
     sunrise.css) are applied to it.  Use absolute paths for images. -->
<style>
#wp_custom { background: linear-gradient(180deg, #0b1030 0%, #40306b 55%, #f08a5d 100%); }
#sun { position: absolute; left: 50%; bottom: 18%; width: 220px; height: 220px; margin-left: -110px;
       border-radius: 110px; background: #ffd89b; animation: rise 20s ease-in-out infinite alternate; }
@keyframes rise { 0% { bottom: 4%; opacity: .7; } 100% { bottom: 34%; opacity: 1; } }
#hill { position: absolute; left: 0; bottom: 0; width: 100%; height: 20%; background: #14102a; }
</style>
<div id="sun"></div>
<div id="hill"></div>
