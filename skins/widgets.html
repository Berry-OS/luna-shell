<!-- Luna Shell common widgets (skin-independent) -->
<div id="widget_clock" class="widget">
  <div id="wg_clock_view">
    <div id="wg_stopwatch_open" class="wg_clock_icon luna_icon" role="button" tabindex="0" aria-label="Open stopwatch">&#xf2f2;</div>
    <div id="wg_time">23:00</div><div id="wg_date">Tuesday, July 28</div>
  </div>
  <div id="wg_stopwatch_view" class="hidden">
    <div id="wg_stopwatch_head"><div id="wg_stopwatch_back" class="wg_clock_icon luna_icon" role="button" tabindex="0" aria-label="Back to clock">&#xf060;</div><span id="wg_stopwatch_title">Stopwatch</span><span id="wg_stopwatch_state">Ready</span></div>
    <div id="wg_stopwatch_time">00:00.0</div>
    <div id="wg_stopwatch_actions"><div id="wg_stopwatch_toggle" class="dlg_btn primary" role="button" tabindex="0">Start</div><div id="wg_stopwatch_reset" class="dlg_btn" role="button" tabindex="0">Reset</div></div>
  </div>
</div>
<div id="widget_stats" class="widget">
  <div class="st_row"><span class="st_label">CPU Usage</span><span class="st_val" id="st_cpu_val">0%</span></div><div class="st_bar"><div class="st_fill" id="st_cpu_fill"></div></div>
  <div class="st_row st_spaced"><span class="st_label">Memory</span><span class="st_val" id="st_mem_val">—</span></div><div class="st_bar"><div class="st_fill g_mem" id="st_mem_fill"></div></div>
  <div class="st_row st_spaced"><span class="st_label">Storage</span><span class="st_val" id="st_disk_val">—</span></div><div class="st_bar"><div class="st_fill g_disk" id="st_disk_fill"></div></div>
</div>
<div id="widget_weather" class="widget">
  <div class="st_row"><span class="st_label" id="wg_wx_city">Weather</span><span class="st_val" id="wg_wx_temp">—</span></div>
  <div id="wg_wx_main"><span class="luna_icon" id="wg_wx_icon">&#xf2c9;</span><span id="wg_wx_desc">Fetching…</span></div>
  <div id="wg_wx_forecast">
    <div id="wg_wf_0" class="wf_day"><div class="wf_name">—</div><div class="wf_icon luna_icon">&#xf2c9;</div><div class="wf_temp">—</div></div>
    <div id="wg_wf_1" class="wf_day"><div class="wf_name">—</div><div class="wf_icon luna_icon">&#xf2c9;</div><div class="wf_temp">—</div></div>
    <div id="wg_wf_2" class="wf_day"><div class="wf_name">—</div><div class="wf_icon luna_icon">&#xf2c9;</div><div class="wf_temp">—</div></div>
    <div id="wg_wf_3" class="wf_day"><div class="wf_name">—</div><div class="wf_icon luna_icon">&#xf2c9;</div><div class="wf_temp">—</div></div>
    <div id="wg_wf_4" class="wf_day"><div class="wf_name">—</div><div class="wf_icon luna_icon">&#xf2c9;</div><div class="wf_temp">—</div></div>
  </div>
</div>
