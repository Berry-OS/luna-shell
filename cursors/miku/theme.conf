# Luna cursor theme — Hatsune Miku
# https://github.com/supermariofps/hatsune-miku-windows-linux-cursors
#
# Switch themes with:
#   LUNA_CURSOR_THEME=miku|builtin
#   or ~/.config/luna-shell/settings.conf → cursor_theme=miku
#
name=Hatsune Miku
default=Blinking Cursor.ani
pointer=hand2_.ani
text=beam.ani
crosshair=Precision Select.ani
ew-resize=Horizontal Resize.ani
ns-resize=Vertical Resize.ani
