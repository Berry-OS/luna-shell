name: Validate root keyboard focus fix

on:
  push:
    branches:
      - agent/fix-refresh-thunderbird-status-width
    paths:
      - .github/workflows/agent-root-keyboard-focus.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply protocol-correct keyboard resource fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one {label}, found {n}")
              p.write_text(text.replace(old, new, 1))

          # Drop the Thunderbird/Betterbird command-name workaround. Input
          # correctness belongs in the compositor's wl_keyboard implementation.
          replace_once(
              "ui/luna-shell.c",
              '''    return cmd && (str_contains_ci(cmd, "firefox") ||\n                   str_contains_ci(cmd, "thunderbird") ||\n                   str_contains_ci(cmd, "betterbird") ||\n                   str_contains_ci(cmd, "mozilla") ||\n                   str_contains_ci(cmd, "chrom") || str_contains_ci(cmd, "brave"));''',
              '''    return cmd && (str_contains_ci(cmd, "firefox") || str_contains_ci(cmd, "mozilla") ||\n                   str_contains_ci(cmd, "chrom") || str_contains_ci(cmd, "brave"));''',
              "Thunderbird browser workaround",
          )

          p = Path("wayland-server-rs/src/server.rs")
          text = p.read_text()

          # A client may bind wl_seat.get_keyboard more than once. Keep every
          # resource for the seat in sync instead of picking an arbitrary
          # HashMap entry.
          old = '''  fn keyboard_id(client: &Client) -> Option<u32> { client.objects.iter().find_map(|(&id, obj)| matches!(obj.role, Role::Keyboard).then_some(id)) }\n  fn pointer_id(client: &Client) -> Option<u32> {'''
          new = '''  fn keyboard_ids(client: &Client) -> Vec<u32> {\n    let mut ids: Vec<u32> = client.objects.iter()\n      .filter_map(|(&id, obj)| matches!(obj.role, Role::Keyboard).then_some(id))\n      .collect();\n    ids.sort_unstable();\n    ids\n  }\n\n  fn pointer_id(client: &Client) -> Option<u32> {'''
          if text.count(old) != 1:
              raise SystemExit("server.rs: keyboard_id helper not found exactly once")
          text = text.replace(old, new, 1)

          # A keyboard resource created while this client already owns seat
          # focus starts with active_surface=NULL. Synchronize it immediately:
          # keymap -> enter -> modifiers, matching wl_keyboard logical state.
          old = '''      // GTK4 crashes without a wl_keyboard keymap event.\n      if opcode == 1 {\n        self.send_keymap(client, nid);\n      }'''
          new = '''      // GTK4 crashes without a wl_keyboard keymap event.\n      if opcode == 1 {\n        self.send_keymap(client, nid);\n\n        // wl_keyboard is a resource-local state object. A client is allowed\n        // to call wl_seat.get_keyboard again after focus was established; the\n        // new object still starts with active_surface=NULL, so initialize it\n        // to the seat's current focus before any key event can reach it.\n        if self.kbd_entered\n          && self.kbd_client_fd == client.conn.fd\n          && self.kbd_surface_id != 0\n        {\n          let serial = self.next_serial();\n          let mut keys = Vec::with_capacity(self.pressed_keys.len() * 4);\n          for &key in &self.pressed_keys {\n            keys.extend_from_slice(&key.to_ne_bytes());\n          }\n          client.send(nid, 1, &[\n            Arg::Uint(serial),\n            Arg::Object(self.kbd_surface_id),\n            Arg::Array(keys),\n          ]);\n          let modifiers_serial = self.next_serial();\n          client.send(nid, 4, &[\n            Arg::Uint(modifiers_serial), Arg::Uint(self.kbd_mods), Arg::Uint(0),\n            Arg::Uint(self.kbd_locked), Arg::Uint(self.kbd_group),\n          ]);\n        }\n      }'''
          if text.count(old) != 1:
              raise SystemExit("server.rs: wl_seat keyboard creation block not found")
          text = text.replace(old, new, 1)

          # Focus-loss on minimize: leave every keyboard resource belonging to
          # the focused client, not whichever HashMap entry happens to win.
          old = '''      let keyboard_id = self.clients.get(&fd).and_then(|client| {\n        client.objects.iter().find_map(|(&id, obj)| matches!(obj.role, Role::Keyboard).then_some(id))\n      });\n      if let Some(keyboard_id) = keyboard_id {\n        let serial = self.next_serial();\n        if let Some(client) = self.clients.get_mut(&fd) {\n          client.send(keyboard_id, 2, &[Arg::Uint(serial), Arg::Object(surface_id)]);\n          client.conn.flush();\n        }\n      }'''
          new = '''      let keyboard_ids = self.clients.get(&fd).map(Self::keyboard_ids).unwrap_or_default();\n      if !keyboard_ids.is_empty() {\n        let serial = self.next_serial();\n        if let Some(client) = self.clients.get_mut(&fd) {\n          for keyboard_id in keyboard_ids {\n            client.send(keyboard_id, 2, &[Arg::Uint(serial), Arg::Object(surface_id)]);\n          }\n          client.conn.flush();\n        }\n      }'''
          if text.count(old) != 1:
              raise SystemExit("server.rs: minimize keyboard leave block not found")
          text = text.replace(old, new, 1)

          # Virtual keyboard forwarding: all keyboard resources mirror the
          # same physical seat state.
          replacements = [
            (
              '''      if let Some(keyboard_id) = Self::keyboard_id(virtual_client) {\n        virtual_client.send(keyboard_id, 3, &[Arg::Uint(serial), Arg::Uint(time), Arg::Uint(key), Arg::Uint(state)]);\n      }''',
              '''      for keyboard_id in Self::keyboard_ids(virtual_client) {\n        virtual_client.send(keyboard_id, 3, &[Arg::Uint(serial), Arg::Uint(time), Arg::Uint(key), Arg::Uint(state)]);\n      }''',
              "virtual key broadcast",
            ),
            (
              '''      if let Some(keyboard_id) = Self::keyboard_id(virtual_client) {\n        virtual_client.send(keyboard_id, 4, &[Arg::Uint(serial), Arg::Uint(depressed), Arg::Uint(latched), Arg::Uint(locked), Arg::Uint(group)]);\n      }''',
              '''      for keyboard_id in Self::keyboard_ids(virtual_client) {\n        virtual_client.send(keyboard_id, 4, &[Arg::Uint(serial), Arg::Uint(depressed), Arg::Uint(latched), Arg::Uint(locked), Arg::Uint(group)]);\n      }''',
              "virtual modifiers broadcast",
            ),
            (
              '''      if let Some(keyboard_id) = Self::keyboard_id(target) {\n        target.send(keyboard_id, 3, &[Arg::Uint(serial), Arg::Uint(time), Arg::Uint(key), Arg::Uint(state)]);\n        target.conn.flush();\n      }''',
              '''      let keyboard_ids = Self::keyboard_ids(target);\n      for keyboard_id in keyboard_ids {\n        target.send(keyboard_id, 3, &[Arg::Uint(serial), Arg::Uint(time), Arg::Uint(key), Arg::Uint(state)]);\n      }\n      target.conn.flush();''',
              "forwarded key broadcast",
            ),
            (
              '''      if let Some(keyboard_id) = Self::keyboard_id(target) {\n        target.send(keyboard_id, 4, &[Arg::Uint(serial), Arg::Uint(depressed), Arg::Uint(latched), Arg::Uint(locked), Arg::Uint(group)]);\n        target.conn.flush();\n      }''',
              '''      let keyboard_ids = Self::keyboard_ids(target);\n      for keyboard_id in keyboard_ids {\n        target.send(keyboard_id, 4, &[Arg::Uint(serial), Arg::Uint(depressed), Arg::Uint(latched), Arg::Uint(locked), Arg::Uint(group)]);\n      }\n      target.conn.flush();''',
              "forwarded modifiers broadcast",
            ),
          ]
          for old, new, label in replacements:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"server.rs: expected one {label}, found {n}")
              text = text.replace(old, new, 1)

          # Physical key path: choose the focused surface, then broadcast the
          # key + modifier state to every wl_keyboard resource for that client.
          old = '''    let (fd, surf_id, kbd_id) = if self.focused_client_fd >= 0 && self.focused_surface_id != 0 {\n      let fd = self.focused_client_fd;\n      let surf_id = self.focused_surface_id;\n      let kbd_id = self\n        .clients\n        .get(&fd)\n        .and_then(|c| {\n          c.objects\n            .iter()\n            .find_map(|(&id, o)| matches!(o.role, Role::Keyboard).then_some(id))\n        })\n        .unwrap_or(0);\n      (fd, surf_id, kbd_id)\n    } else {\n      let Some((fd, surf_id, _, kbd_id, _, _, _, _)) = self.find_input_target() else {\n        return;\n      };\n      (fd, surf_id, kbd_id)\n    };\n    if kbd_id == 0 {\n      return;\n    }\n    self.ensure_kbd_entered(fd, surf_id);\n    let serial = self.next_serial();\n    let s2 = self.next_serial();\n    let ts = now_ms();\n    let state: u32 = if pressed { 1 } else { 0 };\n    let mods = self.kbd_mods;\n    let client = self.clients.get_mut(&fd).unwrap();\n    client.send(kbd_id, 3, &[Arg::Uint(serial), Arg::Uint(ts), Arg::Uint(keycode), Arg::Uint(state)]);\n    client.send(kbd_id, 4, &[Arg::Uint(s2), Arg::Uint(mods), Arg::Uint(0), Arg::Uint(self.kbd_locked), Arg::Uint(self.kbd_group)]);\n    client.conn.flush();'''
          new = '''    let (fd, surf_id) = if self.focused_client_fd >= 0 && self.focused_surface_id != 0 {\n      (self.focused_client_fd, self.focused_surface_id)\n    } else {\n      let Some((fd, surf_id, _, _, _, _, _, _)) = self.find_input_target() else {\n        return;\n      };\n      (fd, surf_id)\n    };\n    if self.clients.get(&fd).map(Self::keyboard_ids).unwrap_or_default().is_empty() {\n      return;\n    }\n    self.ensure_kbd_entered(fd, surf_id);\n    let serial = self.next_serial();\n    let s2 = self.next_serial();\n    let ts = now_ms();\n    let state: u32 = if pressed { 1 } else { 0 };\n    let mods = self.kbd_mods;\n    let client = self.clients.get_mut(&fd).unwrap();\n    for kbd_id in Self::keyboard_ids(client) {\n      client.send(kbd_id, 3, &[Arg::Uint(serial), Arg::Uint(ts), Arg::Uint(keycode), Arg::Uint(state)]);\n      client.send(kbd_id, 4, &[Arg::Uint(s2), Arg::Uint(mods), Arg::Uint(0), Arg::Uint(self.kbd_locked), Arg::Uint(self.kbd_group)]);\n    }\n    client.conn.flush();'''
          if text.count(old) != 1:
              raise SystemExit("server.rs: physical key single-resource block not found")
          text = text.replace(old, new, 1)

          # Focus transitions: leave every resource on the previous client and
          # enter every resource on the new client with identical seat state.
          old = '''        let kbd_id = self.clients.get(&prev_fd).and_then(|c| {\n          c.objects.iter().find_map(|(&id, o)| matches!(o.role, Role::Keyboard).then_some(id))\n        }).unwrap_or(0);\n        if kbd_id != 0 {\n          let serial = self.next_serial();\n          if let Some(client) = self.clients.get_mut(&prev_fd) {\n            client.send(kbd_id, 2, &[Arg::Uint(serial), Arg::Object(prev_surf)]);\n            client.conn.flush();\n          }\n        }'''
          new = '''        let keyboard_ids = self.clients.get(&prev_fd).map(Self::keyboard_ids).unwrap_or_default();\n        if !keyboard_ids.is_empty() {\n          let serial = self.next_serial();\n          if let Some(client) = self.clients.get_mut(&prev_fd) {\n            for keyboard_id in keyboard_ids {\n              client.send(keyboard_id, 2, &[Arg::Uint(serial), Arg::Object(prev_surf)]);\n            }\n            client.conn.flush();\n          }\n        }'''
          if text.count(old) != 1:
              raise SystemExit("server.rs: focus leave single-resource block not found")
          text = text.replace(old, new, 1)

          old = '''      let kbd_id = match self.clients.get(&fd) {\n        Some(c) => c.objects.iter().find(|(_, o)| matches!(o.role, Role::Keyboard)).map(|(&id, _)| id).unwrap_or(0),\n        None => return,\n      };\n      if kbd_id == 0 {\n        return;\n      }\n      let serial = self.next_serial();\n      let mut keys = Vec::with_capacity(self.pressed_keys.len() * 4);\n      for &key in &self.pressed_keys {\n        keys.extend_from_slice(&key.to_ne_bytes());\n      }\n      let mods_serial = self.next_serial();\n      let client = self.clients.get_mut(&fd).unwrap();\n      client.send(kbd_id, 1, &[Arg::Uint(serial), Arg::Object(surf_id), Arg::Array(keys)]);\n      client.send(kbd_id, 4, &[Arg::Uint(mods_serial), Arg::Uint(self.kbd_mods), Arg::Uint(0), Arg::Uint(self.kbd_locked), Arg::Uint(self.kbd_group)]);\n      client.conn.flush();'''
          new = '''      let keyboard_ids = match self.clients.get(&fd) {\n        Some(c) => Self::keyboard_ids(c),\n        None => return,\n      };\n      if keyboard_ids.is_empty() {\n        return;\n      }\n      let serial = self.next_serial();\n      let mut keys = Vec::with_capacity(self.pressed_keys.len() * 4);\n      for &key in &self.pressed_keys {\n        keys.extend_from_slice(&key.to_ne_bytes());\n      }\n      let mods_serial = self.next_serial();\n      let client = self.clients.get_mut(&fd).unwrap();\n      for keyboard_id in keyboard_ids {\n        client.send(keyboard_id, 1, &[Arg::Uint(serial), Arg::Object(surf_id), Arg::Array(keys.clone())]);\n        client.send(keyboard_id, 4, &[Arg::Uint(mods_serial), Arg::Uint(self.kbd_mods), Arg::Uint(0), Arg::Uint(self.kbd_locked), Arg::Uint(self.kbd_group)]);\n      }\n      client.conn.flush();'''
          if text.count(old) != 1:
              raise SystemExit("server.rs: focus enter single-resource block not found")
          text = text.replace(old, new, 1)

          old = '''    let fd = self.kbd_client_fd;\n    let keyboard_id = self.clients.get(&fd).and_then(Self::keyboard_id).unwrap_or(0);\n    if keyboard_id == 0 {\n      return;\n    }\n    let serial = self.next_serial();\n    if let Some(client) = self.clients.get_mut(&fd) {\n      client.send(keyboard_id, 4, &[\n        Arg::Uint(serial), Arg::Uint(self.kbd_mods), Arg::Uint(0),\n        Arg::Uint(self.kbd_locked), Arg::Uint(self.kbd_group),\n      ]);\n      client.conn.flush();\n    }'''
          new = '''    let fd = self.kbd_client_fd;\n    let keyboard_ids = self.clients.get(&fd).map(Self::keyboard_ids).unwrap_or_default();\n    if keyboard_ids.is_empty() {\n      return;\n    }\n    let serial = self.next_serial();\n    if let Some(client) = self.clients.get_mut(&fd) {\n      for keyboard_id in keyboard_ids {\n        client.send(keyboard_id, 4, &[\n          Arg::Uint(serial), Arg::Uint(self.kbd_mods), Arg::Uint(0),\n          Arg::Uint(self.kbd_locked), Arg::Uint(self.kbd_group),\n        ]);\n      }\n      client.conn.flush();\n    }'''
          if text.count(old) != 1:
              raise SystemExit("server.rs: focused modifiers single-resource block not found")
          text = text.replace(old, new, 1)

          # Regression test: a client with more than one keyboard resource must
          # expose all of them in deterministic order.
          marker = '''  fn r(x0: i32, y0: i32, x1: i32, y1: i32) -> Rect {\n    Rect::new(x0, y0, x1, y1)\n  }\n'''
          addition = '''  fn r(x0: i32, y0: i32, x1: i32, y1: i32) -> Rect {\n    Rect::new(x0, y0, x1, y1)\n  }\n\n  #[test]\n  fn keyboard_ids_include_every_bound_resource() {\n    let mut client = Client::new(-1);\n    client.objects.insert(41, Object::new(&protocol::WL_KEYBOARD, 7, Role::Keyboard));\n    client.objects.insert(17, Object::new(&protocol::WL_KEYBOARD, 7, Role::Keyboard));\n    assert_eq!(Server::keyboard_ids(&client), vec![17, 41]);\n  }\n'''
          if text.count(marker) != 1:
              raise SystemExit("server.rs: test insertion marker not found")
          text = text.replace(marker, addition, 1)

          # No single-resource keyboard selector may remain in the input path.
          if "fn keyboard_id(" in text or "Self::keyboard_id" in text:
              raise SystemExit("server.rs: stale single-resource keyboard selector remains")

          p.write_text(text)
          PY

      - name: Check compositor and tests
        run: |
          cargo check --manifest-path wayland-server-rs/Cargo.toml
          cargo check --manifest-path wayland-server-rs/Cargo.toml --features dri
          cargo test --manifest-path wayland-server-rs/Cargo.toml --features dri

      - name: Verify root fix shape
        run: |
          python3 <<'PY'
          from pathlib import Path
          server = Path('wayland-server-rs/src/server.rs').read_text()
          shell = Path('ui/luna-shell.c').read_text()
          assert 'fn keyboard_ids(client: &Client) -> Vec<u32>' in server
          assert 'keyboard_ids_include_every_bound_resource' in server
          assert 'new object still starts with active_surface=NULL' in server
          assert 'fn keyboard_id(' not in server
          assert 'Self::keyboard_id' not in server
          browser = shell[shell.index('static int is_browser_cmd'):shell.index('/* Remove one exact path entry')]
          assert 'thunderbird' not in browser.lower()
          assert 'betterbird' not in browser.lower()
          print('root keyboard focus assertions passed')
          PY

      - name: Commit tested root fix
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add wayland-server-rs/src/server.rs ui/luna-shell.c
          git commit -m "fix wl_keyboard resource focus delivery"
          git push origin HEAD:agent/fix-refresh-thunderbird-status-width
