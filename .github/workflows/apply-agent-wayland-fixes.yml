name: Clean requested Wayland fixes PR

on:
  push:
    branches:
      - agent/fix-wayland-pacing-focus-status

permissions:
  contents: write

jobs:
  clean-final-diff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated fixes are present
        run: |
          ! grep -q 'DriPacedBackend' wayland-server-rs/src/bin/server.rs
          grep -q 'in_flight_frame_done' wayland-server-rs/src/server.rs
          grep -q 'complete_presentation' wayland-server-rs/src/server.rs
          grep -q 'pending_activate = Some((fd, parent))' wayland-server-rs/src/server.rs
          grep -q '"Window".to_string()' wayland-server-rs/src/shell_ipc.rs
          ! grep -q 'else snprintf(buf, sizeof(buf), "AC")' ui/luna-shell.c

      - name: Remove build and one-shot workflow artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf target
          rm -f Cargo.lock
          rm -f .github/workflows/apply-agent-wayland-fixes.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: clean Wayland PR validation artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
