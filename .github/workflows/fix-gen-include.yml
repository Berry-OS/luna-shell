name: Fix gen_include invocation

on:
  push:
    branches:
      - feature/xdg-launchpad-dock-icons
    paths:
      - '.github/workflows/fix-gen-include.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xdg-launchpad-dock-icons
          fetch-depth: 0

      - name: Make generator invocation permission-independent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          s = p.read_text()
          old = 'cd $(UI_DIR) && ./gen_include.sh'
          new = 'cd $(UI_DIR) && sh ./gen_include.sh'
          count = s.count(old)
          if count != 4:
              raise SystemExit(f'expected 4 gen_include invocations, found {count}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/fix-gen-include.yml
          git diff --check

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile .github/workflows/fix-gen-include.yml
          git commit -m 'build: invoke gen_include through sh'
          git push origin HEAD:feature/xdg-launchpad-dock-icons
