name: One-shot widget CSS separation

on:
  push:
    branches:
      - 'agent/separate-widgets-tray-dock-fixes'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove remaining widget-only classes and isolate forecast skin rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          WIDGET_ONLY = re.compile(
              r'(?<![A-Za-z0-9_-])\.wg_[A-Za-z0-9_-]+\b|'
              r'(?<![A-Za-z0-9_-])\.st_(?:row|label|val|bar|fill)\b|'
              r'(?<![A-Za-z0-9_-])\.g_(?:mem|disk)\b'
          )
          FORECAST_CLASS = re.compile(r'(?<![A-Za-z0-9_-])\.wf_(?:day|name|icon|temp)\b')

          def matching_brace(text, open_pos):
              depth = 1
              i = open_pos + 1
              quote = None
              comment = False
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if text[i] == '\\': i += 2; continue
                      if text[i] == quote: quote = None
                      i += 1; continue
                  if text.startswith('/*', i):
                      comment = True; i += 2; continue
                  ch = text[i]
                  if ch in ('"', "'"): quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              raise RuntimeError(f'unbalanced CSS brace at {open_pos}')

          def consume_prefix(text, pos):
              while pos < len(text):
                  if text[pos].isspace(): pos += 1; continue
                  if text.startswith('/*', pos):
                      end = text.find('*/', pos + 2)
                      if end < 0: return len(text)
                      pos = end + 2; continue
                  break
              return pos

          def next_delimiter(text, pos):
              quote = None
              comment = False
              paren = bracket = 0
              i = pos
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i): comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if text[i] == '\\': i += 2; continue
                      if text[i] == quote: quote = None
                      i += 1; continue
                  if text.startswith('/*', i): comment = True; i += 2; continue
                  ch = text[i]
                  if ch in ('"', "'"): quote = ch
                  elif ch == '(': paren += 1
                  elif ch == ')': paren = max(0, paren - 1)
                  elif ch == '[': bracket += 1
                  elif ch == ']': bracket = max(0, bracket - 1)
                  elif paren == 0 and bracket == 0 and ch in '{;': return i, ch
                  i += 1
              return len(text), None

          def split_selectors(header):
              parts = []
              start = 0
              quote = None
              paren = bracket = 0
              i = 0
              while i < len(header):
                  ch = header[i]
                  if quote:
                      if ch == '\\': i += 2; continue
                      if ch == quote: quote = None
                  elif ch in ('"', "'"): quote = ch
                  elif ch == '(': paren += 1
                  elif ch == ')': paren = max(0, paren - 1)
                  elif ch == '[': bracket += 1
                  elif ch == ']': bracket = max(0, bracket - 1)
                  elif ch == ',' and paren == 0 and bracket == 0:
                      parts.append(header[start:i]); start = i + 1
                  i += 1
              parts.append(header[start:])
              return parts

          def rebuild_header(original, selectors):
              trailing = re.search(r'(\s*)$', original).group(1)
              if '\n' in original:
                  indent_match = re.search(r'\n([ \t]*)\S', original)
                  indent = indent_match.group(1) if indent_match else ''
                  core = (',\n' + indent).join(s.strip() for s in selectors)
              else:
                  core = ', '.join(s.strip() for s in selectors)
              return core + trailing

          def clean_region(text):
              out = []
              pos = 0
              removed = scoped = 0
              while pos < len(text):
                  p = consume_prefix(text, pos)
                  out.append(text[pos:p])
                  if p >= len(text): break
                  delim, kind = next_delimiter(text, p)
                  if kind is None:
                      out.append(text[p:]); break
                  if kind == ';':
                      out.append(text[p:delim + 1]); pos = delim + 1; continue
                  header = text[p:delim]
                  close = matching_brace(text, delim)
                  body = text[delim + 1:close]
                  stripped = header.strip().lower()
                  if stripped.startswith('@media') or stripped.startswith('@supports') or stripped.startswith('@layer'):
                      new_body, r, s = clean_region(body)
                      out.append(text[p:delim + 1] + new_body + '}')
                      removed += r; scoped += s
                  elif stripped.startswith('@'):
                      out.append(text[p:close + 1])
                  else:
                      parts = split_selectors(header)
                      kept = []
                      changed = False
                      for raw in parts:
                          selector = raw.strip()
                          if WIDGET_ONLY.search(selector):
                              removed += 1; changed = True; continue
                          if FORECAST_CLASS.search(selector) and '#weather_forecast' not in selector:
                              selector = '#weather_forecast ' + selector
                              scoped += 1; changed = True
                          kept.append(selector)
                      if not changed:
                          out.append(text[p:close + 1])
                      elif kept:
                          out.append(rebuild_header(header, kept) + text[delim:close + 1])
                      # If every selector was widget-only, drop the whole rule.
                  pos = close + 1
              return ''.join(out), removed, scoped

          css_files = sorted(Path('skins').glob('*/style.css')) + [Path('ui/luna-shell.css')]
          total_removed = total_scoped = 0
          for path in css_files:
              original = path.read_text(encoding='utf-8')
              cleaned, removed, scoped = clean_region(original)
              # Remove now-empty legacy section labels; they are no longer skin responsibilities.
              cleaned = re.sub(r'^\s*/\*\s*[-─ ]*Desktop widgets\s*[-─ ]*\*/\s*\n', '', cleaned,
                               flags=re.IGNORECASE | re.MULTILINE)
              if cleaned != original:
                  path.write_text(cleaned, encoding='utf-8')
              if removed or scoped:
                  print(f'{path}: removed {removed}, weather-scoped {scoped}')
              total_removed += removed
              total_scoped += scoped

          if total_removed == 0:
              raise SystemExit('expected remaining widget-only CSS selectors were not found')
          print(f'total widget-only selectors removed: {total_removed}; forecast selectors scoped: {total_scoped}')
          PY

      - name: Validate widgets have no bundled-skin definitions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_bad = re.compile(r'id=["\'](?:widget_clock|widget_stats|widget_weather|luna_shell_widgets)["\']')
          css_bad = re.compile(
              r'#widget_(?:clock|stats|weather)\b|#wg_[A-Za-z0-9_-]+\b|'
              r'(?<![A-Za-z0-9_-])\.widget(?![A-Za-z0-9_-])|'
              r'(?<![A-Za-z0-9_-])\.wg_[A-Za-z0-9_-]+\b|'
              r'(?<![A-Za-z0-9_-])\.st_(?:row|label|val|bar|fill)\b|'
              r'(?<![A-Za-z0-9_-])\.g_(?:mem|disk)\b'
          )
          forecast = re.compile(r'(?<![A-Za-z0-9_-])\.wf_(?:day|name|icon|temp)\b')
          bad = []

          for path in list(Path('skins').glob('*/layout.html')) + [Path('ui/luna-shell.html')]:
              text = path.read_text(encoding='utf-8')
              if html_bad.search(text): bad.append(f'{path}: legacy widget DOM')

          # Rule-level check: no widget-only selector, and forecast skin selectors must be weather-menu scoped.
          for path in list(Path('skins').glob('*/style.css')) + [Path('ui/luna-shell.css')]:
              text = path.read_text(encoding='utf-8')
              if css_bad.search(text): bad.append(f'{path}: widget-only CSS selector remains')
              for match in re.finditer(r'([^{}]+)\{', text):
                  header = match.group(1)
                  if forecast.search(header) and '#weather_forecast' not in header:
                      bad.append(f'{path}: unscoped forecast selector: {header.strip()[:120]}')

          for path in (
              Path('skins/windows-95/layout.html.orig'), Path('skins/windows-95/style.css.orig'),
              Path('skins/windows-xp/layout.html.orig'), Path('skins/windows-xp/style.css.orig'),
          ):
              if path.exists(): bad.append(f'{path}: stale backup remains')

          if bad:
              print('\n'.join(bad))
              raise SystemExit('widget/skin source separation validation failed')

          common = Path('ui/luna-shell-widgets.h').read_text(encoding='utf-8')
          required = ('widget_clock', 'widget_stats', 'widget_weather', 'wg_stopwatch_open', 'st_disk_val', 'st_disk_fill')
          missing = [marker for marker in required if marker not in common]
          if missing: raise SystemExit('missing common widget markers: ' + ', '.join(missing))
          print('validated: bundled skins no longer define desktop widgets')
          PY
          git diff --check

      - name: Commit final separation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-widget-css-separation.yml
          git add skins ui/luna-shell.css
          git diff --cached --check
          git commit -m 'remove remaining widget CSS from skins'
          git push origin "HEAD:${GITHUB_REF_NAME}"
