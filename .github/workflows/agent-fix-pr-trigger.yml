name: Run compositor compatibility patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-refresh-thunderbird-status-width
      - name: Apply patch from staging workflow
        shell: bash
        run: |
          awk '/^          python3 <<'\''PY'\''$/{take=1; next} take && /^          PY$/{exit} take {sub(/^          /, ""); print}' \
            .github/workflows/agent-fix-refresh-thunderbird-status.yml > /tmp/apply_fix.py
          test -s /tmp/apply_fix.py
          python3 /tmp/apply_fix.py
      - name: Check compositor
        run: |
          cargo check --manifest-path wayland-server-rs/Cargo.toml
          cargo check --manifest-path wayland-server-rs/Cargo.toml --features dri
          cargo test --manifest-path wayland-server-rs/Cargo.toml --features dri
      - name: Verify shell edits
        run: |
          grep -q 'str_contains_ci(cmd, "thunderbird")' ui/luna-shell.c
          grep -q 'luna_update_classes(idx, "icon_only"' ui/luna-shell.c
          grep -q '#mb_wifi { width: 30px; min-width: 30px;' skins/default/style.css
      - name: Commit tested source changes
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add wayland-server-rs/src/render/mod.rs \
                  wayland-server-rs/src/render/dri.rs \
                  wayland-server-rs/src/server.rs \
                  ui/luna-shell.c ui/luna-shell.css skins/*/style.css
          git commit -m "fix Wayland refresh and Thunderbird input"
          git push origin HEAD:agent/fix-refresh-thunderbird-status-width
