name: Apply XDG Dock integration

on:
  push:
    branches:
      - feature/xdg-launchpad-dock-icons

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xdg-launchpad-dock-icons
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/xdg_dock_apply.py

      - name: Validate generated diff
        run: |
          git diff --check
          grep -q 'luna_app_icon_resolve' ui/luna-shell.c
          grep -q 'dock_xdg_00' skins/default/layout.html
          grep -q 'dock_xdg_icon' skins/default/style.css

      - name: Remove one-shot helper
        run: |
          rm -f .github/xdg_dock_apply.py
          rm -f .github/workflows/apply-xdg-dock.yml

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/luna-shell.c skins/default/layout.html skins/default/style.css .github
          git commit -m 'feat: integrate XDG app icons with Launchpad and Dock'
          git push origin HEAD:feature/xdg-launchpad-dock-icons
