name: Apply compositor compatibility fix

on:
  push:
    branches:
      - agent/fix-refresh-thunderbird-status-width
    paths:
      - .github/workflows/agent-fix-refresh-thunderbird-status.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one {label}, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Backend exposes the physical output cadence in millihertz.  Other
          # backends retain the existing 60 Hz default.
          replace_once(
              "wayland-server-rs/src/render/mod.rs",
              "pub trait Backend {\n    fn size(&self) -> (u32, u32);\n    fn present(&mut self, fb: &Framebuffer);",
              "pub trait Backend {\n    fn size(&self) -> (u32, u32);\n\n    /// Nominal output refresh rate in millihertz, as advertised by wl_output.\n    /// Backends without a physical mode keep the traditional 60 Hz default.\n    fn refresh_millihz(&self) -> u32 {\n        60_000\n    }\n\n    fn present(&mut self, fb: &Framebuffer);",
              "Backend refresh hook",
          )

          dri = Path("wayland-server-rs/src/render/dri.rs")
          text = dri.read_text()
          old = '''const MIN_FLIP_EVENT_GRACE_MS: u64 = 20;\n\nfn flip_event_grace_ms(vrefresh: u32) -> u64 {\n  // Some legacy drivers leave vrefresh at zero.  Treat implausible values as\n  // 60 Hz; using 1 Hz here would reintroduce a multi-second watchdog stall.\n  let refresh = if vrefresh >= 10 { vrefresh as u64 } else { 60 };\n  MIN_FLIP_EVENT_GRACE_MS.max((2000 + refresh - 1) / refresh)\n}\n'''
          new = '''const MIN_FLIP_EVENT_GRACE_MS: u64 = 20;\nconst DRM_MODE_FLAG_INTERLACE: u32 = 1 << 4;\nconst DRM_MODE_FLAG_DBLSCAN: u32 = 1 << 5;\n\n/// Return the mode cadence with enough precision for wl_output and watchdog\n/// pacing.  `vrefresh` is only an integer hint; deriving the value from the\n/// pixel clock preserves 59.94/74.97-style modes instead of rounding them to\n/// a different client cadence.\nfn mode_refresh_millihz(mode: &ModeInfo) -> u32 {\n  let mut denominator = (mode.htotal as u64).saturating_mul(mode.vtotal as u64);\n  if mode.clock != 0 && denominator != 0 {\n    let mut numerator = (mode.clock as u64).saturating_mul(1_000_000);\n    if mode.flags & DRM_MODE_FLAG_INTERLACE != 0 {\n      numerator = numerator.saturating_mul(2);\n    }\n    if mode.flags & DRM_MODE_FLAG_DBLSCAN != 0 {\n      denominator = denominator.saturating_mul(2);\n    }\n    if mode.vscan > 1 {\n      denominator = denominator.saturating_mul(mode.vscan as u64);\n    }\n    if denominator != 0 {\n      let mhz = (numerator.saturating_add(denominator / 2)) / denominator;\n      if mhz != 0 {\n        return mhz.min(u32::MAX as u64) as u32;\n      }\n    }\n  }\n  if mode.vrefresh >= 10 {\n    mode.vrefresh.saturating_mul(1000)\n  } else {\n    60_000\n  }\n}\n\nfn flip_event_grace_ms(refresh_millihz: u32) -> u64 {\n  // Some legacy drivers expose no usable timing.  Treat implausible values as\n  // 60 Hz; using a near-zero refresh here would create a multi-second stall.\n  let refresh = if refresh_millihz >= 10_000 { refresh_millihz as u64 } else { 60_000 };\n  MIN_FLIP_EVENT_GRACE_MS.max((2_000_000 + refresh - 1) / refresh)\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f"dri.rs: expected one refresh helper, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old = '  fn size(&self) -> (u32, u32) { (self.width, self.height) }\n\n  fn present(&mut self, fb: &Framebuffer) {'
          new = '  fn size(&self) -> (u32, u32) { (self.width, self.height) }\n\n  fn refresh_millihz(&self) -> u32 { mode_refresh_millihz(&self.mode) }\n\n  fn present(&mut self, fb: &Framebuffer) {'
          if text.count(old) != 1:
              raise SystemExit("dri.rs: Backend impl insertion point not found")
          text = text.replace(old, new, 1)
          old = '    let grace_ms = flip_event_grace_ms(self.mode.vrefresh);'
          new = '    let grace_ms = flip_event_grace_ms(mode_refresh_millihz(&self.mode));'
          if text.count(old) != 1:
              raise SystemExit("dri.rs: watchdog call not found")
          text = text.replace(old, new, 1)
          old = '''          eprintln!(\n            "[luna-present] submit fb={} refresh={}Hz",\n            fb_id,\n            if self.mode.vrefresh >= 10 { self.mode.vrefresh } else { 60 },\n          );'''
          new = '''          let refresh_millihz = mode_refresh_millihz(&self.mode);\n          eprintln!(\n            "[luna-present] submit fb={} refresh={:.3}Hz",\n            fb_id,\n            refresh_millihz as f64 / 1000.0,\n          );'''
          if text.count(old) != 1:
              raise SystemExit("dri.rs: present trace block not found")
          text = text.replace(old, new, 1)
          old = '''  #[test]\n  fn flip_event_grace_tracks_two_refresh_periods() {\n    assert_eq!(flip_event_grace_ms(60), 34);\n    assert_eq!(flip_event_grace_ms(30), 67);\n    assert_eq!(flip_event_grace_ms(144), MIN_FLIP_EVENT_GRACE_MS);\n    assert_eq!(flip_event_grace_ms(0), 34);\n  }'''
          new = '''  #[test]\n  fn flip_event_grace_tracks_two_refresh_periods() {\n    assert_eq!(flip_event_grace_ms(60_000), 34);\n    assert_eq!(flip_event_grace_ms(30_000), 67);\n    assert_eq!(flip_event_grace_ms(144_000), MIN_FLIP_EVENT_GRACE_MS);\n    assert_eq!(flip_event_grace_ms(0), 34);\n  }\n\n  #[test]\n  fn mode_refresh_uses_pixel_clock_precision() {\n    let mut mode = ModeInfo::default();\n    mode.clock = 148_500;\n    mode.htotal = 2200;\n    mode.vtotal = 1125;\n    mode.vrefresh = 59; // prove the timing, not the rounded hint, wins\n    assert_eq!(mode_refresh_millihz(&mode), 60_000);\n\n    mode.clock = 148_352;\n    assert!((mode_refresh_millihz(&mode) as i64 - 59_940).abs() <= 1);\n  }'''
          if text.count(old) != 1:
              raise SystemExit("dri.rs: refresh test block not found")
          dri.write_text(text.replace(old, new, 1))

          # Use the same physical cadence both for wl_output and the page-flip
          # watchdog wakeup.  A fixed 16 ms timer is wrong for 75/120/144 Hz.
          replace_once(
              "wayland-server-rs/src/server.rs",
              '''      let timeout = if self.backend.present_busy() {\n        16\n      } else if work {\n        0\n      } else {\n        -1\n      };''',
              '''      let refresh_millihz = self.backend.refresh_millihz().max(10_000) as u64;\n      let present_watchdog_ms =\n        ((1_000_000u64 + refresh_millihz - 1) / refresh_millihz).clamp(1, 100) as i32;\n      let timeout = if self.backend.present_busy() {\n        present_watchdog_ms\n      } else if work {\n        0\n      } else {\n        -1\n      };''',
              "refresh-aware epoll watchdog",
          )
          replace_once(
              "wayland-server-rs/src/server.rs",
              'client.send(id, 1, &[Arg::Uint(0x3), Arg::Int(w as i32), Arg::Int(h as i32), Arg::Int(60000)]);',
              'client.send(id, 1, &[Arg::Uint(0x3), Arg::Int(w as i32), Arg::Int(h as i32), Arg::Int(self.backend.refresh_millihz().min(i32::MAX as u32) as i32)]);',
              "wl_output refresh",
          )

          # Thunderbird/Betterbird use Gecko's Wayland stack and need the same
          # system-libwayland / conservative renderer environment as Firefox.
          replace_once(
              "ui/luna-shell.c",
              '''    return cmd && (str_contains_ci(cmd, "firefox") || str_contains_ci(cmd, "mozilla") ||\n                   str_contains_ci(cmd, "chrom") || str_contains_ci(cmd, "brave"));''',
              '''    return cmd && (str_contains_ci(cmd, "firefox") ||\n                   str_contains_ci(cmd, "thunderbird") ||\n                   str_contains_ci(cmd, "betterbird") ||\n                   str_contains_ci(cmd, "mozilla") ||\n                   str_contains_ci(cmd, "chrom") || str_contains_ci(cmd, "brave"));''',
              "Gecko launcher classification",
          )
          replace_once(
              "ui/luna-shell.c",
              '''        if (g_cached_bat >= 0) snprintf(buf, sizeof(buf), "%d%%", g_cached_bat);\n        else buf[0] = '\\0';\n        if (g_mb_bat_icon_idx >= 0 &&''',
              '''        if (g_cached_bat >= 0) snprintf(buf, sizeof(buf), "%d%%", g_cached_bat);\n        else buf[0] = '\\0';\n        /* Keep AC-only power status as compact as the other icon-only items. */\n        luna_update_classes(idx, "icon_only", g_cached_bat < 0 ? "icon_only" : NULL);\n        if (g_mb_bat_icon_idx >= 0 &&''',
              "AC icon-only class",
          )

          marker = '''\n/* Compact icon-only status items: labels were removed from Wi-Fi/AC, so do\n * not retain their old text-sized minimum hit boxes. */\n#mb_wifi { width: 30px; min-width: 30px; padding-left: 5px; padding-right: 5px; }\n#mb_bat.icon_only { width: 30px; min-width: 30px; padding-left: 5px; padding-right: 5px; }\n'''
          css_paths = [Path("ui/luna-shell.css"), *sorted(Path("skins").glob("*/style.css"))]
          patched = 0
          for p in css_paths:
              text = p.read_text()
              if "#mb_wifi" not in text:
                  continue
              if "Compact icon-only status items" in text:
                  continue
              p.write_text(text.rstrip() + "\n" + marker)
              patched += 1
          if patched < 2:
              raise SystemExit(f"expected to patch fallback + skin CSS, patched {patched}")
          print(f"patched {patched} CSS files")
          PY

      - name: Check compositor
        run: |
          cargo check --manifest-path wayland-server-rs/Cargo.toml
          cargo check --manifest-path wayland-server-rs/Cargo.toml --features dri
          cargo test --manifest-path wayland-server-rs/Cargo.toml --features dri

      - name: Verify shell compatibility edits
        run: |
          python3 <<'PY'
          from pathlib import Path
          shell = Path("ui/luna-shell.c").read_text()
          assert 'str_contains_ci(cmd, "thunderbird")' in shell
          assert 'str_contains_ci(cmd, "betterbird")' in shell
          assert 'luna_update_classes(idx, "icon_only"' in shell
          for p in [Path("ui/luna-shell.css"), *Path("skins").glob("*/style.css")]:
              text = p.read_text()
              if "#mb_wifi" in text:
                  assert "#mb_wifi { width: 30px; min-width: 30px;" in text, p
          print("shell compatibility assertions passed")
          PY

      - name: Commit tested source changes
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add wayland-server-rs/src/render/mod.rs \
                  wayland-server-rs/src/render/dri.rs \
                  wayland-server-rs/src/server.rs \
                  ui/luna-shell.c ui/luna-shell.css skins/*/style.css
          git commit -m "fix Wayland refresh and Thunderbird input"
          git push origin HEAD:agent/fix-refresh-thunderbird-status-width
