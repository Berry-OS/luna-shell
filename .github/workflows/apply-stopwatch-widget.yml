name: Apply stopwatch widget implementation

on:
  push:
    branches:
      - agent/clock-stopwatch-widget

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Luna Shell
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply stopwatch widget changes
        run: python3 tools/apply-stopwatch-widget.py

      - name: Regenerate embedded UI resources
        run: |
          cd ui
          ./gen_include.sh -o luna-shell.css.h ../skins/default/style.css
          ./gen_include.sh -o luna-shell.html.h ../skins/default/layout.html

      - name: Install luna-shell build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgbm-dev libdrm-dev libinput-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin \
            libdbus-1-dev libssl-dev

      - name: Build luna-shell
        run: make luna-shell

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'id="wg_stopwatch_view"' skins/default/layout.html
          grep -q 'static void stopwatch_tick(void)' ui/luna-shell.c
          grep -q '#widget_clock.stopwatch_mode' skins/default/style.css

      - name: Commit implementation and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins/default/layout.html skins/default/style.css \
                  ui/luna-shell.c ui/luna-shell.css.h ui/luna-shell.html.h
          git rm .github/workflows/apply-stopwatch-widget.yml tools/apply-stopwatch-widget.py
          git commit -m "Add stopwatch mode to clock widget"
          git push origin "HEAD:${GITHUB_REF_NAME}"
