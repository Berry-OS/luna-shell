name: One-shot legacy widget cleanup

on:
  push:
    branches:
      - 'agent/separate-widgets-tray-dock-fixes'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy widget definitions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          HTML_FILES = sorted((ROOT / 'skins').glob('*/layout.html')) + [ROOT / 'ui/luna-shell.html']
          CSS_FILES = sorted((ROOT / 'skins').glob('*/style.css')) + [ROOT / 'ui/luna-shell.css']
          OLD_BACKUPS = [
              ROOT / 'skins/windows-95/layout.html.orig',
              ROOT / 'skins/windows-95/style.css.orig',
              ROOT / 'skins/windows-xp/layout.html.orig',
              ROOT / 'skins/windows-xp/style.css.orig',
          ]

          legacy_open = re.compile(
              r'<div\b[^>]*\bid=["\'](?:widget_clock|widget_stats|widget_weather|luna_shell_widgets)["\'][^>]*>',
              re.IGNORECASE,
          )
          div_token = re.compile(r'<!--.*?-->|</?div\b[^>]*>', re.IGNORECASE | re.DOTALL)

          def div_end(text: str, start: int) -> int:
              depth = 0
              for match in div_token.finditer(text, start):
                  token = match.group(0)
                  if token.startswith('<!--'):
                      continue
                  if re.match(r'</div\b', token, re.IGNORECASE):
                      depth -= 1
                      if depth == 0:
                          return match.end()
                  else:
                      depth += 1
              raise RuntimeError(f'unbalanced div starting at offset {start}')

          def clean_html(text: str) -> tuple[str, int]:
              removed = 0
              while True:
                  match = legacy_open.search(text)
                  if not match:
                      break
                  end = div_end(text, match.start())
                  line_start = text.rfind('\n', 0, match.start()) + 1
                  prefix = text[line_start:match.start()]
                  start = line_start if not prefix.strip() else match.start()
                  text = text[:start] + text[end:]
                  removed += 1
              text = re.sub(r'\n[ \t]*<!--\s*Desktop Widgets\s*-->[ \t]*(?=\n)', '\n', text, flags=re.IGNORECASE)
              text = re.sub(r'\n{4,}', '\n\n\n', text)
              return text, removed

          widget_selector = re.compile(
              r'#widget_(?:clock|stats|weather)\b|'
              r'#wg_[A-Za-z0-9_-]+\b|'
              r'#st_(?:cpu|mem|disk)_[A-Za-z0-9_-]+\b|'
              r'(?<![A-Za-z0-9_-])\.widget(?![A-Za-z0-9_-])'
          )

          def find_matching_brace(text: str, open_pos: int) -> int:
              depth = 1
              i = open_pos + 1
              quote = None
              comment = False
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  if text[i] in ('"', "'"):
                      quote = text[i]
                  elif text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError(f'unbalanced CSS brace at offset {open_pos}')

          def split_selector_list(header: str) -> list[str]:
              parts, start, paren, bracket = [], 0, 0, 0
              quote = None
              for i, ch in enumerate(header):
                  if quote:
                      if ch == quote and (i == 0 or header[i - 1] != '\\'):
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren = max(0, paren - 1)
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket = max(0, bracket - 1)
                  elif ch == ',' and paren == 0 and bracket == 0:
                      parts.append(header[start:i].strip())
                      start = i + 1
              parts.append(header[start:].strip())
              return [p for p in parts if p]

          def clean_css_region(text: str) -> tuple[str, int]:
              out = []
              pos = 0
              removed = 0
              while True:
                  open_pos = text.find('{', pos)
                  if open_pos < 0:
                      out.append(text[pos:])
                      break
                  close_pos = find_matching_brace(text, open_pos)
                  header_start = pos
                  header = text[header_start:open_pos]

                  # Preserve leading comments/whitespace separately from the selector/at-rule.
                  m = re.search(r'([^{}]*?)\s*$', header, flags=re.DOTALL)
                  rule_header = m.group(1) if m else header
                  leading_len = len(header) - len(rule_header)
                  leading = header[:leading_len]
                  stripped = rule_header.strip()
                  body = text[open_pos + 1:close_pos]

                  if stripped.lower().startswith('@media') or stripped.lower().startswith('@supports'):
                      cleaned_body, nested_removed = clean_css_region(body)
                      out.append(header + '{' + cleaned_body + '}')
                      removed += nested_removed
                  elif stripped.startswith('@'):
                      out.append(header + '{' + body + '}')
                  else:
                      selectors = split_selector_list(rule_header)
                      kept = [s for s in selectors if not widget_selector.search(s)]
                      removed += len(selectors) - len(kept)
                      if kept:
                          indent_match = re.search(r'(^|\n)([ \t]*)[^\n]*$', leading + rule_header)
                          indent = indent_match.group(2) if indent_match else ''
                          rebuilt = (',\n' + indent).join(kept)
                          out.append(leading + rebuilt + ' {' + body + '}')
                      else:
                          out.append(leading.rstrip())
                  pos = close_pos + 1
              return ''.join(out), removed

          changed = []
          for path in HTML_FILES:
              if not path.exists():
                  continue
              original = path.read_text(encoding='utf-8')
              cleaned, count = clean_html(original)
              if cleaned != original:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(f'{path}: removed {count} legacy widget DOM roots')

          for path in CSS_FILES:
              if not path.exists():
                  continue
              original = path.read_text(encoding='utf-8')
              cleaned, count = clean_css_region(original)
              if cleaned != original:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(f'{path}: removed {count} widget-specific selectors')

          for path in OLD_BACKUPS:
              if path.exists():
                  path.unlink()
                  changed.append(f'{path}: deleted stale backup')

          print('\n'.join(changed))
          if not changed:
              raise SystemExit('cleanup made no changes')
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = list(Path('skins').glob('*/layout.html')) + list(Path('skins').glob('*/style.css'))
          targets += [Path('ui/luna-shell.html'), Path('ui/luna-shell.css')]
          forbidden = re.compile(
              r'id=["\'](?:widget_clock|widget_stats|widget_weather|luna_shell_widgets)["\']|'
              r'#widget_(?:clock|stats|weather)\b|#wg_[A-Za-z0-9_-]+\b|'
              r'#st_(?:cpu|mem|disk)_[A-Za-z0-9_-]+\b|'
              r'(?<![A-Za-z0-9_-])\.widget(?![A-Za-z0-9_-])'
          )
          bad = []
          for path in targets:
              if not path.exists():
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if forbidden.search(line):
                      bad.append(f'{path}:{lineno}: {line.strip()}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit('legacy widget definitions remain')

          for path in (
              Path('skins/windows-95/layout.html.orig'), Path('skins/windows-95/style.css.orig'),
              Path('skins/windows-xp/layout.html.orig'), Path('skins/windows-xp/style.css.orig'),
          ):
              if path.exists():
                  raise SystemExit(f'stale backup remains: {path}')
          print('legacy widget source definitions removed')
          PY
          git diff --check

      - name: Commit cleanup and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-legacy-widgets.yml
          git add skins ui/luna-shell.html ui/luna-shell.css
          git diff --cached --check
          git commit -m 'remove legacy skin widget definitions'
          git push origin "HEAD:${GITHUB_REF_NAME}"
