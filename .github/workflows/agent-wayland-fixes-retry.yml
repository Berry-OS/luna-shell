name: Retry Wayland rendering and shell fixes

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/wayland-jank-notification-history-widgets

      - name: Extract guarded patch script
        shell: bash
        run: |
          awk '/^          python3 <<'\''PY'\''$/{take=1; next} take && /^          PY$/{exit} take {sub(/^          /, ""); print}' \
            .github/workflows/agent-wayland-fixes.yml > /tmp/wayland_fixes.py
          test -s /tmp/wayland_fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/wayland_fixes.py')
          s = p.read_text()
          old = "layouts = [Path('ui/luna-shell.html')] + [Path(p) for p in glob.glob('skins/*/layout.html')]"
          new = old + "\nlayouts = [p for p in layouts if p.exists() and '  <!-- Top Menu Bar -->' in p.read_text()]"
          if s.count(old) != 1:
              raise SystemExit('layout list marker changed')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 /tmp/wayland_fixes.py

      - name: Regenerate embedded layout
        run: |
          chmod +x ui/gen_include.sh
          make ui/luna-shell.html.h

      - name: Validate DRI compositor
        run: |
          cargo check -p wayland-server-rs --features dri
          cargo test -p wayland-server-rs --features dri

      - name: Install shell build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdrm-dev libgbm-dev libegl1-mesa-dev libgl-dev libinput-dev libudev-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libssl-dev libx11-dev wayland-protocols

      - name: Build Luna shell
        run: make luna-shell

      - name: Verify requested behavior is represented
        run: |
          grep -q 'front_present_pending' wayland-server-rs/src/render/dri.rs
          grep -q 'switching to paced front-buffer updates' wayland-server-rs/src/render/dri.rs
          grep -q 'widgets_enabled' ui/luna-shell.c
          grep -q 'notification_history_push' ui/luna-shell.c
          grep -q 'id="notify_0"' skins/default/layout.html
          grep -q 'id="wm_widgets"' skins/default/layout.html
          python3 - <<'PY'
          from pathlib import Path
          s = Path('skins/default/layout.html').read_text()
          assert s.index('<!-- Desktop Widgets -->') < s.index('<!-- Top Menu Bar -->')
          PY

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add wayland-server-rs/src/render/dri.rs ui/luna-shell.c ui/luna-shell.html ui/luna-shell.html.h skins/*/layout.html
          git diff --cached --check
          git commit -m "fix Wayland frame pacing and desktop widgets"
          git push origin HEAD:fix/wayland-jank-notification-history-widgets
