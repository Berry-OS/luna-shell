name: Validate and clean PR 10 shell UI changes

on:
  pull_request:
    branches:
      - master
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate-and-clean:
    if: github.event.pull_request.head.ref == 'agent/ui-notify-email-window-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-notify-email-window-controls
          fetch-depth: 0
          submodules: recursive

      - name: Gate cleanup synchronization
        id: gate
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == bootstrap:\ cleanup\ PR\ 10\ build\ artifacts* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-cleanup synchronization: $subject"
          fi

      - name: Remove validation artifacts from the PR
        if: steps.gate.outputs.run == 'true'
        run: |
          git rm -r --ignore-unmatch target Cargo.lock tools/agent_cleanup_trigger.txt

      - name: Install luna-shell build dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev \
            libinput-dev libudev-dev libxkbcommon-dev libwayland-dev libwayland-bin \
            libdbus-1-dev libssl-dev

      - name: Build C luna-shell
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          chmod +x ui/gen_include.sh
          make luna-shell
          rm -f luna-shell

      - name: Verify generated headers and staged cleanup
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git diff --check
          git diff --cached --check
          test -z "$(git diff --name-only -- ui/luna-shell.css.h ui/luna-shell.html.h)"
          bad="$(git diff --cached --name-only | grep -Ev '^(Cargo.lock|target/|tools/agent_cleanup_trigger.txt$)' || true)"
          test -z "$bad"

      - name: Commit cleanup
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove validation artifacts"
          git push origin HEAD:agent/ui-notify-email-window-controls
