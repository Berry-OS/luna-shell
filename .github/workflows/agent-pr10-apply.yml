name: Finalize PR 10 review fixes

on:
  pull_request:
    branches:
      - master
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/ui-notify-email-window-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-notify-email-window-controls
          fetch-depth: 0
          submodules: recursive

      - name: Gate final review-fix synchronization
        id: gate
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == bootstrap:\ finalize\ PR\ 10\ review\ fixes* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-finalize synchronization: $subject"
          fi

      - name: Apply final review fixes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cpath = Path('ui/luna-shell.c')
          c = cpath.read_text()

          send_block = '''    snprintf(cmd, sizeof(cmd), "wm_config focus_outline %d", g_settings.active_window_outline);\n    ok &= shell_send_cmd(cmd);\n    snprintf(cmd, sizeof(cmd), "wm_config cascade_windows %d", g_settings.cascade_new_windows);\n    ok &= shell_send_cmd(cmd);\n'''
          if c.count(send_block) != 1:
              raise SystemExit(f'expected one WM preference send block, found {c.count(send_block)}')
          c = c.replace(send_block, '', 1)
          fn_start = c.index('static void apply_wm_settings(void) {')
          retry_if = c.index('    if (ok) {', fn_start)
          c = c[:retry_if] + send_block + '\n' + c[retry_if:]

          old_helper = '''static void tray_sync_window_tips_and_visibility(void) {\n    for (int s = 0; s < MAX_TRAY_SLOTS; s++) {\n        const char* key = g_tray_slot_key[s];\n        int is_window = tray_key_is_window(key);\n        LunaTrayEntry* t = is_window ? tray_entry_for_key(key) : NULL;\n        if (g_tray_tip_idx[s] >= 0) {\n            const char* tip = t ? (t->tooltip[0] ? t->tooltip : t->label) : "";\n            luna_set_text(g_tray_tip_idx[s], tip);\n            set_hidden(g_tray_tip_idx[s], !tip[0]);\n        }\n        if (!g_settings.window_tray_icons && is_window && g_tray_slot_idx[s] >= 0)\n            set_hidden(g_tray_slot_idx[s], 1);\n    }\n}\n'''
          new_helper = '''static void tray_sync_window_tips_and_visibility(void) {\n    int visible = 0;\n    for (int s = 0; s < MAX_TRAY_SLOTS; s++) {\n        const char* key = g_tray_slot_key[s];\n        int is_window = tray_key_is_window(key);\n        int hide_window = !g_settings.window_tray_icons && is_window;\n        LunaTrayEntry* t = is_window ? tray_entry_for_key(key) : NULL;\n        if (g_tray_tip_idx[s] >= 0) {\n            const char* tip = t ? (t->tooltip[0] ? t->tooltip : t->label) : "";\n            luna_set_text(g_tray_tip_idx[s], tip);\n            set_hidden(g_tray_tip_idx[s], !tip[0]);\n        }\n        if (hide_window && g_tray_slot_idx[s] >= 0) {\n            set_hidden(g_tray_slot_idx[s], 1);\n        } else if (key && *key && g_tray_slot_idx[s] >= 0) {\n            visible++;\n        }\n    }\n    if (g_tray_area_idx >= 0)\n        set_hidden(g_tray_area_idx, visible == 0);\n}\n'''
          if c.count(old_helper) != 1:
              raise SystemExit(f'expected one tray visibility helper, found {c.count(old_helper)}')
          c = c.replace(old_helper, new_helper, 1)

          old_tail = '''    if (g_tray_area_idx >= 0) set_hidden(g_tray_area_idx, used == 0);\n    luna_mark_layout_dirty();\n    shell_request_repaint(1);\n    tray_sync_window_tips_and_visibility();\n'''
          new_tail = '''    if (g_tray_area_idx >= 0) set_hidden(g_tray_area_idx, used == 0);\n    tray_sync_window_tips_and_visibility();\n    luna_mark_layout_dirty();\n    shell_request_repaint(1);\n'''
          if c.count(old_tail) != 1:
              raise SystemExit(f'expected one update_tray_ui tail, found {c.count(old_tail)}')
          c = c.replace(old_tail, new_tail, 1)

          c = c.replace('static int g_stab_sound_idx = -1;\nstatic int g_stab_display_idx = -1;',
                        'static int g_stab_sound_idx        = -1;\nstatic int g_stab_display_idx      = -1;', 1)
          c = c.replace('    g_stab_sound_idx = luna_get_element_by_id("stab_sound");\n    g_stab_display_idx = luna_get_element_by_id("stab_display");',
                        '    g_stab_sound_idx    = luna_get_element_by_id("stab_sound");\n    g_stab_display_idx  = luna_get_element_by_id("stab_display");', 1)
          cpath.write_text(c)

          rpath = Path('wayland-server-rs/src/server.rs')
          r = rpath.read_text()
          old_rust = '''          let cascade = if self.wm_cascade_windows {\n          (self.window_stack.len().saturating_sub(1) as i32) * 28\n        } else {\n          0\n        };'''
          new_rust = '''          let cascade = if self.wm_cascade_windows {\n            (self.window_stack.len().saturating_sub(1) as i32) * 28\n          } else {\n            0\n          };'''
          if r.count(old_rust) != 1:
              raise SystemExit(f'expected one cascade indentation target, found {r.count(old_rust)}')
          r = r.replace(old_rust, new_rust, 1)
          rpath.write_text(r)
          PY

      - name: Install luna-shell build dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev \
            libinput-dev libudev-dev libxkbcommon-dev libwayland-dev libwayland-bin \
            libdbus-1-dev libssl-dev

      - name: Validate Rust compositor
        if: steps.gate.outputs.run == 'true'
        run: |
          cargo check --manifest-path wayland-server-rs/Cargo.toml
          cargo test --manifest-path wayland-server-rs/Cargo.toml

      - name: Validate C shell build and diff
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          chmod +x ui/gen_include.sh
          make luna-shell
          rm -f luna-shell
          rm -rf target Cargo.lock
          git diff --check
          grep -n -B6 -A2 'if (ok) {' ui/luna-shell.c | grep 'wm_config focus_outline'
          grep -n 'int visible = 0;' ui/luna-shell.c
          grep -n 'set_hidden(g_tray_area_idx, visible == 0)' ui/luna-shell.c

      - name: Commit final fixes
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          git rm -f tools/agent_finalize_trigger.txt
          git add ui/luna-shell.c wayland-server-rs/src/server.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden window preference updates"
          git push origin HEAD:agent/ui-notify-email-window-controls
