name: One-shot widget cleanup normalization

on:
  push:
    branches:
      - 'agent/separate-widgets-tray-dock-fixes'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore CSS and remove only widget-owned selectors
        shell: bash
        run: |
          # Restore the exact CSS bytes from before the first cleanup pass.
          git checkout b2253866f19165c88d8433631efa09ba1eae948f -- skins/*/style.css ui/luna-shell.css
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGET = re.compile(
              r'#widget_(?:clock|stats|weather)\b|'
              r'#wg_[A-Za-z0-9_-]+\b|'
              r'#st_(?:cpu|mem|disk)_[A-Za-z0-9_-]+\b|'
              r'(?<![A-Za-z0-9_-])\.widget(?![A-Za-z0-9_-])'
          )

          def matching_brace(text, open_pos):
              depth = 1
              i = open_pos + 1
              quote = None
              comment = False
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  ch = text[i]
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError(f'unbalanced CSS brace at {open_pos}')

          def consume_prefix(text, pos):
              while pos < len(text):
                  if text[pos].isspace():
                      pos += 1
                      continue
                  if text.startswith('/*', pos):
                      end = text.find('*/', pos + 2)
                      if end < 0:
                          return len(text)
                      pos = end + 2
                      continue
                  break
              return pos

          def next_delimiter(text, pos):
              quote = None
              comment = False
              paren = bracket = 0
              i = pos
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  ch = text[i]
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren = max(0, paren - 1)
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket = max(0, bracket - 1)
                  elif paren == 0 and bracket == 0 and ch in '{;':
                      return i, ch
                  i += 1
              return len(text), None

          def split_selectors(header):
              parts = []
              start = 0
              quote = None
              paren = bracket = 0
              i = 0
              while i < len(header):
                  ch = header[i]
                  if quote:
                      if ch == '\\':
                          i += 2
                          continue
                      if ch == quote:
                          quote = None
                  elif ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren = max(0, paren - 1)
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket = max(0, bracket - 1)
                  elif ch == ',' and paren == 0 and bracket == 0:
                      parts.append(header[start:i])
                      start = i + 1
                  i += 1
              parts.append(header[start:])
              return parts

          def clean_region(text):
              out = []
              pos = 0
              removed = 0
              while pos < len(text):
                  p = consume_prefix(text, pos)
                  out.append(text[pos:p])
                  if p >= len(text):
                      break
                  delim, kind = next_delimiter(text, p)
                  if kind is None:
                      out.append(text[p:])
                      break
                  if kind == ';':
                      out.append(text[p:delim + 1])
                      pos = delim + 1
                      continue

                  header = text[p:delim]
                  close = matching_brace(text, delim)
                  body = text[delim + 1:close]
                  stripped = header.strip().lower()
                  if stripped.startswith('@media') or stripped.startswith('@supports') or stripped.startswith('@layer'):
                      new_body, count = clean_region(body)
                      out.append(text[p:delim + 1] + new_body + '}')
                      removed += count
                  elif stripped.startswith('@'):
                      out.append(text[p:close + 1])
                  else:
                      parts = split_selectors(header)
                      kept = [part for part in parts if not TARGET.search(part)]
                      dropped = len(parts) - len(kept)
                      removed += dropped
                      if dropped == 0:
                          out.append(text[p:close + 1])
                      elif kept:
                          trailing = re.search(r'(\s*)$', header).group(1)
                          if '\n' in header:
                              indent_match = re.search(r'\n([ \t]*)\S', header)
                              indent = indent_match.group(1) if indent_match else ''
                              rebuilt = (',\n' + indent).join(part.strip() for part in kept)
                          else:
                              rebuilt = ', '.join(part.strip() for part in kept)
                          out.append(rebuilt + trailing + text[delim:close + 1])
                      # all selectors dropped: keep only already-copied whitespace/comments
                  pos = close + 1
              return ''.join(out), removed

          files = sorted(Path('skins').glob('*/style.css')) + [Path('ui/luna-shell.css')]
          total = 0
          for path in files:
              original = path.read_text(encoding='utf-8')
              cleaned, count = clean_region(original)
              if count:
                  path.write_text(cleaned, encoding='utf-8')
                  print(f'{path}: removed {count} widget-owned selectors')
                  total += count
          if total == 0:
              raise SystemExit('no widget selectors removed')
          PY

      - name: Validate final source separation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          definition_pattern = re.compile(
              r'id=["\'](?:widget_clock|widget_stats|widget_weather|luna_shell_widgets)["\']|'
              r'#widget_(?:clock|stats|weather)\b|#wg_[A-Za-z0-9_-]+\b|'
              r'#st_(?:cpu|mem|disk)_[A-Za-z0-9_-]+\b|'
              r'(?<![A-Za-z0-9_-])\.widget(?![A-Za-z0-9_-])'
          )
          bad = []
          targets = list(Path('skins').glob('*/layout.html')) + list(Path('skins').glob('*/style.css'))
          targets += [Path('ui/luna-shell.html'), Path('ui/luna-shell.css')]
          for path in targets:
              if not path.exists():
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if definition_pattern.search(line):
                      bad.append(f'{path}:{lineno}: {line.strip()}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit('legacy widget definitions remain outside luna-shell-widgets.h')

          for path in (
              Path('skins/windows-95/layout.html.orig'), Path('skins/windows-95/style.css.orig'),
              Path('skins/windows-xp/layout.html.orig'), Path('skins/windows-xp/style.css.orig'),
          ):
              if path.exists():
                  raise SystemExit(f'stale widget backup remains: {path}')

          widgets = Path('ui/luna-shell-widgets.h').read_text(encoding='utf-8')
          for marker in ('id=\\"widget_clock\\"', 'id=\\"widget_stats\\"', 'id=\\"widget_weather\\"', 'wg_stopwatch_open'):
              if marker not in widgets:
                  raise SystemExit(f'common widget source missing marker: {marker}')
          print('source separation validated: bundled skins contain no legacy widget definitions')
          PY
          git diff --check

      - name: Commit normalized cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-widget-cleanup.yml
          git add skins ui/luna-shell.html ui/luna-shell.css
          git diff --cached --check
          git commit -m 'keep widget cleanup CSS diff minimal'
          git push origin "HEAD:${GITHUB_REF_NAME}"
